<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Mail Automation | Launch Campaign</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="container animate-fade-in">
    <header>
      <h1><i class="fa-solid fa-robot"></i> AI Mail Agent</h1>
      <p class="subtitle">Automated, personalized email campaigns at scale.</p>
    </header>

    <!-- Mode Switcher -->
    <div class="tabs delay-1 animate-fade-in">
      <button class="tab-btn active" onclick="switchMode('bulk')">
        <i class="fa-solid fa-users"></i> Bulk Blast
      </button>
      <button class="tab-btn" onclick="switchMode('single')">
        <i class="fa-solid fa-paper-plane"></i> Single Email
      </button>
    </div>

    <main class="glass-panel delay-2 animate-fade-in" style="padding: 2rem;">
      <form action="/send" method="POST" enctype="multipart/form-data" id="campaign-form">
        <input type="hidden" name="mode" id="mode-input" value="bulk">

        <!-- Bulk Section -->
        <div id="bulk-section" class="visible">
          <div class="form-group">
            <label>Recipient List (CSV)</label>
            <div id="drop-zone" class="file-upload-area">
              <input type="file" name="file" id="file" class="file-input" accept=".csv">
              <div class="file-label">
                <i class="fa-solid fa-cloud-arrow-up icon-upload"></i>
                <span>Drag & drop your CSV file here</span>
                <small style="color: var(--text-muted)">Columns: email, name</small>
              </div>
            </div>
            <div id="file-name" class="file-name" style="text-align: center; opacity: 0; transition: opacity 0.3s;">
            </div>
          </div>
        </div>

        <!-- Single Section -->
        <div id="single-section" class="hidden">
          <div class="form-group">
            <label for="recipient_email">Recipient Email</label>
            <input type="email" name="recipient_email" id="recipient_email" placeholder="recipient@example.com">
          </div>
          <div class="form-group">
            <label for="recipient_name">Recipient Name (Optional)</label>
            <input type="text" name="recipient_name" id="recipient_name" placeholder="John Doe">
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 2rem 0;">

        <!-- Common Fields -->
        <div class="form-group">
          <label for="from_addr">From Address (Optional)</label>
          <input type="email" name="from_addr" id="from_addr" placeholder="Defaults to configured SMTP user">
        </div>

        <div class="form-group">
          <label for="subject">Subject Line</label>
          <input type="text" name="subject" id="subject" placeholder="Enter an engaging subject..." required>
        </div>

        <div class="form-group">
          <label for="body">Email Body</label>
          <textarea name="body" id="body" placeholder="Hello {{name}},&#10;&#10;I am writing to you about..."
            required></textarea>
          <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">
            <i class="fa-solid fa-circle-info"></i> Pro Tip: Use <strong>{{name}}</strong> to auto-insert the
            recipient's name.
          </small>
        </div>

        <!-- Submit Action -->
        <div style="text-align: center; margin-top: 2rem;">
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-rocket" style="margin-right: 0.5rem;"></i> Send Campaign
          </button>
        </div>
      </form>
    </main>

    <footer>
      <p>&copy; 2025 AI Mail Automation Agent. Built for performance.</p>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
