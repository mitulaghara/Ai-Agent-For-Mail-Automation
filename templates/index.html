<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Mail Sender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --primary: #6366f1;
        --secondary: #8b5cf6;
        --accent: #ec4899;
      }
      
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      .container-wrapper {
        width: 100%;
        padding: 20px;
      }
      
      .card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }
      
      .card-header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        color: white;
        padding: 30px;
        border: none;
      }
      
      .card-title {
        font-size: 2rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.5px;
      }
      
      .card-body {
        padding: 40px;
        background: #f8fafc;
      }
      
      .form-group {
        margin-bottom: 28px;
      }
      
      .form-label {
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 10px;
        font-size: 1rem;
        display: block;
      }
      
      .form-control, .form-control:focus {
        border-radius: 12px;
        border: 2px solid #e2e8f0;
        padding: 12px 16px;
        font-size: 1rem;
        transition: all 0.3s ease;
      }
      
      .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
      }
      
      textarea.form-control {
        font-family: 'Courier New', monospace;
        resize: vertical;
        min-height: 150px;
      }
      
      .form-file-input {
        position: relative;
      }
      
      .form-file-input input[type="file"] {
        display: none;
      }
      
      .file-label {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        border: 2px dashed var(--primary);
        border-radius: 12px;
        cursor: pointer;
        background: rgba(99, 102, 241, 0.05);
        transition: all 0.3s ease;
        text-align: center;
        color: var(--primary);
      }
      
      .file-label:hover {
        border-color: var(--secondary);
        background: rgba(99, 102, 241, 0.1);
      }
      
      .file-icon {
        font-size: 2rem;
        margin-bottom: 10px;
      }
      
      .btn-send {
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        border: none;
        color: white;
        padding: 14px 40px;
        font-weight: 600;
        border-radius: 12px;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        width: 100%;
        cursor: pointer;
        letter-spacing: 0.5px;
      }
      
      .btn-send:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        color: white;
      }
      
      .btn-send:active {
        transform: translateY(0);
      }
      
      .help-text {
        font-size: 0.85rem;
        color: #64748b;
        margin-top: 6px;
        font-style: italic;
      }
      
      .badge-info {
        background: rgba(99, 102, 241, 0.1);
        color: var(--primary);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 600;
        display: inline-block;
        margin-top: 4px;
      }
      
      @media (max-width: 768px) {
        .card-body {
          padding: 25px;
        }
        
        .card-title {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container-wrapper">
      <div class="container" style="max-width: 700px;">
        <div class="card">
          <div class="card-header">
            <h1 class="card-title">📧 Bulk Mail Sender</h1>
          </div>
          <div class="card-body">
            <form action="/send" method="post" enctype="multipart/form-data">
              <!-- File Upload -->
              <div class="form-group form-file-input">
                <label for="file" class="file-label">
                  <div>
                    <div class="file-icon">📁</div>
                    <strong>Click to upload CSV</strong>
                    <p style="margin: 8px 0 0; font-size: 0.9rem;">or drag and drop</p>
                  </div>
                </label>
                <input type="file" id="file" name="file" accept=".csv" required>
                <div class="help-text">Must contain email column</div>
              </div>

              <!-- From Email -->
              <div class="form-group">
                <label for="from_addr" class="form-label">From Address (Optional)</label>
                <input type="email" id="from_addr" class="form-control" name="from_addr" placeholder="Leave empty to use SMTP user">
                <div class="help-text">Leave blank to use configured SMTP email</div>
              </div>

              <!-- Subject -->
              <div class="form-group">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" id="subject" class="form-control" name="subject" placeholder="e.g., Welcome to our newsletter" required>
              </div>

              <!-- Body -->
              <div class="form-group">
                <label for="body" class="form-label">Email Body</label>
                <textarea id="body" class="form-control" name="body" placeholder="Hi {{name}},&#10;&#10;Your personalized message here..." required></textarea>
                <div class="badge-info">💡 Use {{name}} to personalize</div>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn-send">🚀 Send Bulk Emails</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const fileInput = document.getElementById('file');
      const fileLabel = document.querySelector('.file-label').parentElement;
      
      fileLabel.addEventListener('dragover', (e) => {
        e.preventDefault();
        fileLabel.style.borderColor = 'var(--secondary)';
        fileLabel.style.background = 'rgba(99, 102, 241, 0.15)';
      });
      
      fileLabel.addEventListener('dragleave', () => {
        fileLabel.style.borderColor = 'var(--primary)';
        fileLabel.style.background = 'rgba(99, 102, 241, 0.05)';
      });
      
      fileLabel.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
        }
      });
    </script>
  </body>
</html>
